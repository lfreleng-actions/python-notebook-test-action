---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# python-notebook-test-action
name: 'Verify Jupyter Notebooks'
description: 'Validates Jupyter Notebooks with pytest and nbmake'

# Related documentation
# https://github.com/treebeardtech/nbmake

inputs:
  # Mandatory
  python_version:
    description: 'Python version used to run tests'
    required: true
    # type: string
  # Optional
  permit_fail:
    description: 'Continue even when one or more tests fails'
    required: false
    # type: boolean
    default: 'false'
  path_prefix:
    description: 'Directory location containing Python project code'
    # type: string
    required: false
    default: '.'
  parallel_tests:
    # Note: installs and uses pytest-xdist
    description: 'Parallel pytest/nbmake processes'
    # type: boolean
    required: false
    default: 'false'
  nbmake_kernel:
    description: 'Force nbmake to use a specific kernel'
    # type: string
    required: false
  install_kernel:
    description: 'Install custom kernel prior to testing'
    # type: string
    required: false
  PYTEST_FLAGS:
    description: 'Flags to send to the pytest command'
    # type: string
    required: false
    default: '--no-cov'

runs:
  using: 'composite'
  steps:
    - name: 'Setup action/environment'
      id: setup
      shell: bash
      env:
        PYTHON_VERSION: "${{ inputs.python_version }}"
        PATH_PREFIX: "${{ inputs.path_prefix }}"
        PERMIT_FAIL: "${{ inputs.permit_fail }}"
      run: |
        # Setup action/environment
        if [ -z "$PYTHON_VERSION" ]; then
          echo 'Error: Python version was not provided ❌'; exit 1
        else
          echo "Using Python: $PYTHON_VERSION 🐍"
        fi

        # Handle path_prefix input consistently and when absent
        path_prefix="$PATH_PREFIX"
        if [ -z "$path_prefix" ]; then
          # Set current directory as path prefix
          path_prefix="."
        else
          # Strip any trailing slash in provided path
          path_prefix="${path_prefix%/}"
        fi
        # Verify is a valid directory path
        if [ ! -d "$path_prefix" ]; then
          echo 'Error: invalid path/prefix to project directory ❌'; exit 1
        fi
        # Use the heredoc output form with a unique delimiter to
        # guard against output injection via crafted input values
        delimiter="ghadelim_$$_${RANDOM}${RANDOM}${RANDOM}"
        {
          echo "path_prefix<<${delimiter}"
          echo "$path_prefix"
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"

        if [ "f$PERMIT_FAIL" = "ftrue" ]; then
          echo 'Warning: test failures will be permitted ⚠️'
        fi

    - name: "Setup Python"
      id: setup-python
      # yamllint disable-line rule:line-length
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: 'Cache Python dependencies'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cache/pip
          ~/.cache/pypoetry
          ~/.cache/pipenv
          .venv
          .tox
        # yamllint disable rule:line-length
        key: >-
          python-${{ runner.os }}-${{ inputs.python_version }}-
          ${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/poetry.lock', '**/Pipfile*', '**/setup.py', '**/setup.cfg') }}
        restore-keys: |
          python-${{ runner.os }}-${{ inputs.python_version }}-
          python-${{ runner.os }}-
        # yamllint enable rule:line-length

    - name: 'Create isolated virtual environment'
      id: venv
      shell: bash
      env:
        BASE_PYTHON: "${{ steps.setup-python.outputs.python-path }}"
      run: |
        # Create isolated virtual environment
        # Packages go here, not into the job's interpreter, so nothing
        # this action installs leaks into later steps of the job
        venv_dir="$RUNNER_TEMP/python-notebook-test-action/venv"
        echo "Creating virtual environment: $venv_dir 🐍"
        # Recreate on each run so state never carries over between calls
        "$BASE_PYTHON" -m venv --clear "$venv_dir"
        if [ -f "$venv_dir/bin/python" ]; then
          venv_python="$venv_dir/bin/python"
        else
          venv_python="$venv_dir/Scripts/python.exe"
        fi
        delimiter="ghadelim_$$_${RANDOM}${RANDOM}${RANDOM}"
        {
          echo "dir<<${delimiter}"
          echo "$venv_dir"
          echo "${delimiter}"
          echo "python<<${delimiter}"
          echo "$venv_python"
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"

    - name: 'Install notebook/test dependencies'
      id: flags
      shell: bash
      env:
        PATH_PREFIX: "${{ steps.setup.outputs.path_prefix }}"
        NBMAKE_KERNEL: "${{ inputs.nbmake_kernel }}"
        PARALLEL_TESTS: "${{ inputs.parallel_tests }}"
        VENV_PYTHON: "${{ steps.venv.outputs.python }}"
      run: |
        # Install notebook/test dependencies
        pip_install() {
          "$VENV_PYTHON" -m pip install --disable-pip-version-check -q "$@"
        }
        echo 'Installing: pytest, pytest-cov, nbmake ⬇️'
        # Note: pytest-xdist used for parallel testing
        pip_install pytest pytest-cov nbmake

        echo 'Install project and dependencies'
        if [ -f "$PATH_PREFIX/pyproject.toml" ]; then
            echo "Source: $PATH_PREFIX/pyproject.toml ⬇️"
            pip_install "$PATH_PREFIX/"
        elif [ -f "$PATH_PREFIX/requirements.txt" ]; then
          echo "Source: $PATH_PREFIX/requirements.txt ⬇️"
          pip_install -r "$PATH_PREFIX/requirements.txt"
        else
          # Jupyter Notebooks are not necessarily Python projects
          echo 'No Python dependencies to install ⚠️'
        fi

        # Set appropriate flags to nbmake
        if [ -n "$NBMAKE_KERNEL" ]; then
          echo "Forcing use of a custom kernel: $NBMAKE_KERNEL 💬"
          # Use the heredoc output form with a unique delimiter to
          # guard against output injection via crafted input values
          delimiter="ghadelim_$$_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "kernel_flags<<${delimiter}"
            echo "--nbmake-kernel=$NBMAKE_KERNEL"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
        fi
        # Set flags for parallel testing
        if [ "$PARALLEL_TESTS" = 'true' ]; then
          echo "flags=-n=auto" >> "$GITHUB_OUTPUT"
        fi

    - name: 'Install Pytest parallel test tool'
      if: inputs.parallel_tests == 'true'
      shell: bash
      env:
        VENV_PYTHON: "${{ steps.venv.outputs.python }}"
      run: |
        # Install parallel test tool
        echo 'Installing: pytest-xdist ⬇️'
        "$VENV_PYTHON" -m pip install --disable-pip-version-check -q \
          pytest-xdist

    - name: "Error when kernel not specified but install requested"
      if: inputs.install_kernel == 'true' && inputs.nbmake_kernel == ''
      shell: bash
      run: |
        # Error when kernel not specified but install requested
        echo 'Error: kernel install requested but name NOT specified ❌'
        exit 1

    - name: 'Install nbmake custom kernel'
      if: inputs.install_kernel == 'true'
      shell: bash
      env:
        NBMAKE_KERNEL: "${{ inputs.nbmake_kernel }}"
        VENV_PYTHON: "${{ steps.venv.outputs.python }}"
      run: |
        # Install nbmake custom kernel
        echo "Installing custom nbmake kernel: $NBMAKE_KERNEL ⬇️"
        "$VENV_PYTHON" -m ipykernel install --user --name "$NBMAKE_KERNEL"

    - name: 'Build/test Jupyter Notebooks'
      shell: bash
      env:
        PATH_PREFIX: "${{ steps.setup.outputs.path_prefix }}"
        PERMIT_FAIL: "${{ inputs.permit_fail }}"
        PYTEST_FLAGS: "${{ inputs.pytest_flags }}"
        KERNEL_FLAGS: "${{ steps.flags.outputs.kernel_flags }}"
        FLAGS: "${{ steps.flags.outputs.flags }}"
        VENV_DIR: "${{ steps.venv.outputs.dir }}"
        VENV_PYTHON: "${{ steps.venv.outputs.python }}"
      run: |
        # Build/Test Jupyter Notebooks
        # Put the venv first on PATH for this step alone, so notebook
        # subprocesses (python, pip, console scripts) use the venv too;
        # GITHUB_PATH stays untouched and later steps see no change
        venv_bin="$(dirname "$VENV_PYTHON")"
        if command -v cygpath > /dev/null 2>&1; then
          venv_bin="$(cygpath -u "$venv_bin")"
        fi
        export PATH="$venv_bin:$PATH"
        export VIRTUAL_ENV="$VENV_DIR"
        echo 'Searching repository for Jupyter Notebooks'
        mapfile -t notebooks < <(find "$PATH_PREFIX/" -name '*.ipynb')
        if [ "${#notebooks[@]}" -eq 0 ]; then
          echo 'Error: no Jupyter Notebooks were found ❌'; exit 1
        fi
        printf '%s\n' "${notebooks[@]}"
        # Word splitting of the flag variables below is intentional
        if [ "f$PERMIT_FAIL" = 'ftrue' ]; then
          echo 'Warning: flag set to permit test failures ⚠️'
          # shellcheck disable=SC2086
          "$VENV_PYTHON" -m pytest --nbmake \
            $PYTEST_FLAGS \
            $KERNEL_FLAGS \
            $FLAGS \
            "${notebooks[@]}" || true
        else
          # shellcheck disable=SC2086
          "$VENV_PYTHON" -m pytest --nbmake \
            $PYTEST_FLAGS \
            $KERNEL_FLAGS \
            $FLAGS \
            "${notebooks[@]}"
        fi
